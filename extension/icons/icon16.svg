<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Pixel-aligned version of icon.svg for the 16px toolbar size: lines on whole pixels so they stay sharp. -->
  <defs>
    <linearGradient id="sf-bg16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="4" fill="url(#sf-bg16)"/>
  <g fill="#ffffff" shape-rendering="crispEdges">
    <rect x="4" y="4" width="8" height="2"/>
    <rect x="4" y="7" width="6" height="2"/>
    <rect x="4" y="10" width="4" height="2"/>
    <rect x="10" y="10" width="2" height="2"/>
  </g>
</svg>
