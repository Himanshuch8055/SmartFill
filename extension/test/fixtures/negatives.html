<!-- Fields that look similar to profile fields but must not be filled -->
<form>
  <input name="q" placeholder="Search products" data-expect="none">
  <input name="hotel_name" placeholder="Hotel name" data-expect="none">
  <input name="page_title" placeholder="Page title" data-expect="none">
  <textarea name="statement_of_purpose" placeholder="Statement of purpose" data-expect="none"></textarea>
  <select name="company_size" data-expect="none"><option>1-10</option></select>
  <input name="coupon" placeholder="Coupon code" data-expect="none">
  <input name="otp" placeholder="Enter OTP" data-expect="none">
  <input name="captcha_answer" placeholder="Type the characters" data-expect="none">
  <input name="confirm_email" placeholder="Confirm email" data-expect="none">
  <input name="file_name" placeholder="File name" data-expect="none">
  <input name="pan_number" placeholder="PAN number" data-expect="none">
  <input name="account_number" placeholder="Account number" data-expect="none">
  <input name="ethnicity" placeholder="Ethnicity" data-expect="none">
  <input name="hidden_email" type="hidden" value="" data-expect="none">
  <input name="readonly_email" readonly data-expect="none">
  <input name="disabled_email" disabled data-expect="none">
  <div hidden><input name="email_in_hidden_section" data-expect="none"></div>
</form>
