<!-- Shopify-style checkout: shipping + billing + payment -->
<form>
  <input name="email" type="email" autocomplete="email" placeholder="Email or mobile phone number" data-expect="email">
  <input name="search" type="search" placeholder="Search" data-expect="none">
  <fieldset><legend>Shipping address</legend>
    <select name="countryCode" autocomplete="shipping country" data-expect="country"><option value="IN">India</option><option value="US">United States</option></select>
    <input name="firstName" autocomplete="shipping given-name" placeholder="First name (optional)" data-expect="firstName">
    <input name="lastName" autocomplete="shipping family-name" placeholder="Last name" data-expect="lastName">
    <input name="address1" autocomplete="shipping address-line1" placeholder="Address" data-expect="address1">
    <input name="address2" autocomplete="shipping address-line2" placeholder="Apartment, suite, etc. (optional)" data-expect="address2">
    <input name="city" autocomplete="shipping address-level2" placeholder="City" data-expect="city">
    <select name="zone" autocomplete="shipping address-level1" data-expect="state"><option value="MH">Maharashtra</option></select>
    <input name="postalCode" autocomplete="shipping postal-code" placeholder="PIN code" data-expect="zip">
    <input name="phone" type="tel" autocomplete="shipping tel" placeholder="Phone" data-expect="phone">
  </fieldset>
  <fieldset><legend>Billing address</legend>
    <input name="billing_first_name" placeholder="First name" data-expect="firstName">
    <input name="billing_last_name" placeholder="Last name" data-expect="lastName">
    <input name="billing_address1" placeholder="Address" data-expect="address1">
    <input name="billing_city" placeholder="City" data-expect="city">
    <input name="billing_zip" placeholder="ZIP code" data-expect="zip">
  </fieldset>
  <fieldset><legend>Payment</legend>
    <input name="number" autocomplete="cc-number" placeholder="Card number" data-expect="none">
    <input name="name" autocomplete="cc-name" placeholder="Name on card" data-expect="none">
    <input name="expiry" autocomplete="cc-exp" placeholder="Expiration date (MM / YY)" data-expect="none">
    <input name="verification_value" autocomplete="cc-csc" placeholder="Security code" data-expect="none">
  </fieldset>
  <input name="reductions" placeholder="Discount code or gift card" data-expect="none">
</form>
