<!-- Lever-style job application -->
<form>
  <ul>
    <li class="application-question"><label><div class="application-label">Full name</div><input type="text" name="name" data-expect="fullName"></label></li>
    <li class="application-question"><label><div class="application-label">Email</div><input type="email" name="email" data-expect="email"></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div><input type="text" name="phone" data-expect="phone"></label></li>
    <li class="application-question"><label><div class="application-label">Current company</div><input type="text" name="org" data-expect="company"></label></li>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div><input type="text" name="urls[LinkedIn]" data-expect="linkedin"></label></li>
    <li class="application-question"><label><div class="application-label">GitHub URL</div><input type="text" name="urls[GitHub]" data-expect="github"></label></li>
    <li class="application-question"><label><div class="application-label">Portfolio URL</div><input type="text" name="urls[Portfolio]" data-expect="portfolio"></label></li>
    <li class="application-question"><label><div class="application-label">Additional information</div><textarea name="comments" data-expect="none"></textarea></label></li>
  </ul>
</form>
