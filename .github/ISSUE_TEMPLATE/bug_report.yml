name: Bug report
description: Something in SmartFill is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If a specific website fills incorrectly, please use the **Site not filling correctly** template instead.
        Never paste real personal data (your profile values) into an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SmartFill version
      description: Shown on chrome://extensions or about:addons
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Brave, Firefox, Other]
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version and OS
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Console errors (optional)
      description: Errors from the page console or the extension's service worker console.
      render: text
