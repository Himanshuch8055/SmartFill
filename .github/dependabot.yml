version: 2
updates:
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
